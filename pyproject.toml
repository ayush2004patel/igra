[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "igra"
version = "0.1.0.dev0"
description = "Isolated Generation and Recovery Architecture - local-first PostgreSQL database state management for developers."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Ayush" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.scripts]
igra = "igra.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
