name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: igra_dev
          POSTGRES_PASSWORD: igra_dev_pass
          POSTGRES_DB: igra_dev_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PostgreSQL client tools (pg_dump / pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install IGRA with dev dependencies
        run: pip install -e ".[dev]"

      - name: Seed test database with sample table
        env:
          PGPASSWORD: igra_dev_pass
        run: |
          psql -h localhost -U igra_dev -d igra_dev_test -c \
            "CREATE TABLE customers (id SERIAL PRIMARY KEY, name TEXT NOT NULL); INSERT INTO customers (name) VALUES ('Alice'), ('Bob'), ('Carol');"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run test suite
        run: python -m pytest tests/ -v
